# Minimal configuration for @cloudflare/vitest-pool-workers.
# The production wrangler.toml has main (worker.ts), a queues consumer, etc., and loading it as-is
# would make vitest-pool-workers' bundler try to resolve worker.ts and fail on the $lib alias,
# so we split out just the minimum needed to test D1 bindings into this separate file.
name = "tullamore-test"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "tullamore-test"
database_id = "test-d1-database"
migrations_dir = "drizzle"
