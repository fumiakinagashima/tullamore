name = "tullamore"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

main = "worker.ts"
assets = { directory = ".svelte-kit/cloudflare/", binding = "ASSETS" }

[[d1_databases]]
binding = "DB"
database_name = "tullamore"
database_id = "c0c65eba-4eaa-464c-9294-40e25e63d5dc"
migrations_dir = "drizzle"

[[kv_namespaces]]
binding = "KV"
id = "fabfbf60a3a444a89992788d512910a7"

[[r2_buckets]]
binding = "R2"
bucket_name = "tullamore"

# 外部DB接続（データ連携、/connections）。PostgreSQL/MySQL両対応（バインディングの形
# （connectionStringの有無）からエンジンを自動判別する。src/lib/server/db-connections/hyperdrive.ts 参照）。
# Hyperdriveはバインディングが静的なため、接続を追加するには実際に
# `wrangler hyperdrive create <name> --connection-string="postgres://..."`（またはmysql://）を実行してIDを発行し、
# ここにバインディングを追加してデプロイし直す必要がある（docs/DATA_CONNECTIONS.md 参照）。
# バインディング名は必ず `HYPERDRIVE_` で始めること（実行時にこのプレフィックスでスキャンして一覧化している）。
#
# ローカル開発用（docker-compose.yml のPostgres/MySQLサンプル接続）の [[hyperdrive]] ブロックはここには置かない。
# `id` にプレースホルダー文字列を使うと `wrangler dev`/`bun dev`（localConnectionString経由）は動くが、
# `wrangler deploy` は `id` を実在のHyperdrive Config UUIDとして検証するため
# "Invalid hyperdrive database ID '...'. It must be a valid UUID. [code: 10156]" で本番デプロイが失敗する
# （2026-07-06に実際にこれで初回デプロイが失敗した）。ローカルで docker-compose のサンプルDBを試す場合は
# `docs/DATA_CONNECTIONS.md`「ローカル開発」記載のブロックを一時的にこのファイルに追加し、コミットしない。

# 外部DB接続（データ連携）の大規模テーブル継続取り込み用Queue。SYNC_ROW_BUDGET（ingest.ts）を超えた分を
# バックグラウンドで処理する（src/lib/server/db-connections/queue-consumer.ts、docs/DATA_CONNECTIONS.md 参照）。
# 本番へデプロイする前に `wrangler queues create tullamore-ingest` を実行しておくこと
# （`wrangler dev` のローカル実行時はMiniflareがメモリ内でシミュレートするため事前作成不要）。
[[queues.producers]]
binding = "INGEST_QUEUE"
queue = "tullamore-ingest"

[[queues.consumers]]
queue = "tullamore-ingest"
max_batch_size = 1
max_retries = 2

[vars]
MOCK_AI = "false"
