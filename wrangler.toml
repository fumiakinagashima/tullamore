name = "tullamore"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

main = "worker.ts"
assets = { directory = ".svelte-kit/cloudflare/", binding = "ASSETS" }

[[d1_databases]]
binding = "DB"
database_name = "tullamore"
database_id = "c0c65eba-4eaa-464c-9294-40e25e63d5dc"
migrations_dir = "drizzle"

[[kv_namespaces]]
binding = "KV"
id = "fabfbf60a3a444a89992788d512910a7"

[[r2_buckets]]
binding = "R2"
bucket_name = "tullamore"

# 外部DB接続（データ連携、/connections）。PostgreSQL/MySQL両対応（バインディングの形
# （connectionStringの有無）からエンジンを自動判別する。src/lib/server/db-connections/hyperdrive.ts 参照）。
# Hyperdriveはバインディングが静的なため、接続を追加するには実際に
# `wrangler hyperdrive create <name> --connection-string="postgres://..."`（またはmysql://）を実行してIDを発行し、
# ここにバインディングを追加してデプロイし直す必要がある（docs/DATA_CONNECTIONS.md 参照）。
# バインディング名は必ず `HYPERDRIVE_` で始めること（実行時にこのプレフィックスでスキャンして一覧化している）。
# ローカル開発用に、docker-compose.yml のPostgres/MySQLへ向けたサンプル接続を用意している。
# localConnectionString がある間は id は実際には参照されないため、本番のHyperdrive configを作るまでは
# プレースホルダーのままでよい。
[[hyperdrive]]
binding = "HYPERDRIVE_LOCAL_SAMPLE"
id = "local-sample-placeholder"
localConnectionString = "postgres://tullamore:tullamore@localhost:55432/tullamore_sample"

[[hyperdrive]]
binding = "HYPERDRIVE_LOCAL_SAMPLE_MYSQL"
id = "local-sample-mysql-placeholder"
localConnectionString = "mysql://tullamore:tullamore@localhost:3306/tullamore_sample"

[vars]
MOCK_AI = "false"
