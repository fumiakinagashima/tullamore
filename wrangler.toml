name = "tullamore"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

main = "worker.ts"
assets = { directory = ".svelte-kit/cloudflare/", binding = "ASSETS" }

[[d1_databases]]
binding = "DB"
database_name = "tullamore"
database_id = ""
migrations_dir = "drizzle"

# KV: 本番デプロイ前に `wrangler kv namespace create tullamore` を実行し id を本番用の値に置き換えること
[[kv_namespaces]]
binding = "KV"
id = "dummy"

# R2: 本番デプロイ前に `wrangler r2 bucket create tullamore` を実行すること
[[r2_buckets]]
binding = "R2"
bucket_name = "tullamore"

[vars]
MOCK_AI = "false"
