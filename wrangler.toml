name = "tullamore"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

main = "worker.ts"
assets = { directory = ".svelte-kit/cloudflare/", binding = "ASSETS" }

# Replace these with your own D1 database, created via `wrangler d1 create tullamore`.
[[d1_databases]]
binding = "DB"
database_name = "tullamore"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "drizzle"

# Replace with your own KV namespace, created via `wrangler kv namespace create KV`.
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# Replace with your own R2 bucket, created via `wrangler r2 bucket create tullamore`.
[[r2_buckets]]
binding = "R2"
bucket_name = "tullamore"

# External DB connections (data ingestion, /connections). Supports both PostgreSQL and MySQL
# (the engine is auto-detected from the binding shape — presence of connectionString — see
# src/lib/server/db-connections/hyperdrive.ts). Hyperdrive bindings are static, so adding a
# connection requires actually running
# `wrangler hyperdrive create <name> --connection-string="postgres://..."` (or mysql://) to
# issue an ID, then adding the binding here and redeploying (see docs/DATA_CONNECTIONS.md).
# Binding names must always start with `HYPERDRIVE_` (the app scans for this prefix at runtime
# to build the list).
#
# Don't put the local-dev [[hyperdrive]] block (for the Postgres/MySQL sample connections in
# docker-compose.yml) here. Using a placeholder string for `id` works for `wrangler dev`/`bun dev`
# (via localConnectionString), but `wrangler deploy` validates `id` as a real Hyperdrive Config
# UUID, so production deploys fail with "Invalid hyperdrive database ID '...'. It must be a valid
# UUID. [code: 10156]". To try the docker-compose sample DBs locally, temporarily add the block
# described under "Local development" in docs/DATA_CONNECTIONS.md to this file, and don't commit it.

# Queue for background ingestion of large external tables (data connections). Handles rows beyond
# SYNC_ROW_BUDGET (ingest.ts) asynchronously (see src/lib/server/db-connections/queue-consumer.ts
# and docs/DATA_CONNECTIONS.md). Run `wrangler queues create tullamore-ingest` before deploying to
# production (not needed for local `wrangler dev`, since Miniflare simulates it in memory).
[[queues.producers]]
binding = "INGEST_QUEUE"
queue = "tullamore-ingest"

[[queues.consumers]]
queue = "tullamore-ingest"
max_batch_size = 1
max_retries = 2

[vars]
MOCK_AI = "false"
