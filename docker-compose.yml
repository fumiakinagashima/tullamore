# Sample Postgres/MySQL for verifying data connections (/connections, external DB ingestion via
# Hyperdrive/TCP Sockets) end-to-end locally. Start with `docker compose up -d`; the
# localConnectionString for HYPERDRIVE_LOCAL_SAMPLE / HYPERDRIVE_LOCAL_SAMPLE_MYSQL in wrangler.toml
# points at these DBs.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tullamore
      POSTGRES_PASSWORD: tullamore
      POSTGRES_DB: tullamore_sample
    ports:
      # Host side uses 55432 (changed because 5432 can conflict with Postgres from other projects)
      - '55432:5432'
    volumes:
      - tullamore_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro

  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: tullamore
      MYSQL_DATABASE: tullamore_sample
      MYSQL_USER: tullamore
      MYSQL_PASSWORD: tullamore
    ports:
      - '3306:3306'
    volumes:
      - tullamore_mysql_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro

volumes:
  tullamore_postgres_data:
  tullamore_mysql_data:
