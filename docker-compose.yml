# データ連携（/settings/data-connections、Hyperdrive経由の外部DB取り込み）をローカルで
# エンドツーエンドに確認するためのサンプルPostgres。`docker compose up -d` で起動し、
# wrangler.toml の HYPERDRIVE_LOCAL_SAMPLE の localConnectionString がこのDBを指す。
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tullamore
      POSTGRES_PASSWORD: tullamore
      POSTGRES_DB: tullamore_sample
    ports:
      # ホスト側は55432（5432は他プロジェクトのPostgresと衝突することがあるため変更）
      - '55432:5432'
    volumes:
      - tullamore_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro

volumes:
  tullamore_postgres_data:
