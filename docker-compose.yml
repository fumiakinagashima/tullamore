# データ連携（/connections、Hyperdrive/TCP Sockets経由の外部DB取り込み）をローカルで
# エンドツーエンドに確認するためのサンプルPostgres/MySQL。`docker compose up -d` で起動し、
# wrangler.toml の HYPERDRIVE_LOCAL_SAMPLE / HYPERDRIVE_LOCAL_SAMPLE_MYSQL の
# localConnectionString がこれらのDBを指す。
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tullamore
      POSTGRES_PASSWORD: tullamore
      POSTGRES_DB: tullamore_sample
    ports:
      # ホスト側は55432（5432は他プロジェクトのPostgresと衝突することがあるため変更）
      - '55432:5432'
    volumes:
      - tullamore_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro

  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: tullamore
      MYSQL_DATABASE: tullamore_sample
      MYSQL_USER: tullamore
      MYSQL_PASSWORD: tullamore
    ports:
      - '3306:3306'
    volumes:
      - tullamore_mysql_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro

volumes:
  tullamore_postgres_data:
  tullamore_mysql_data:
